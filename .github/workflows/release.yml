name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0). If empty, a dev prerelease is created."
        required: false
        default: ""

permissions:
  contents: write

env:
  APP_NAME: skinforge
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_NOLOGO: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          PRERELEASE=false
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" ]]; then
            TAG="dev-${GITHUB_SHA::7}"
            PRERELEASE=true
          elif [[ "$TAG" == *-* ]]; then
            # v0.2.0-beta.1, v1.0.0-rc.1 ...
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64
    needs: version
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PKG: skinforge-${{ needs.version.outputs.tag }}-windows-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8 SDK
        shell: bash
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Restore C# Realm Bridge
        shell: pwsh
        run: dotnet restore realm-bridge/realm-bridge.csproj -r win-x64 --verbosity normal

      - name: Publish C# Realm Bridge (Self-Contained)
        shell: pwsh
        run: dotnet publish realm-bridge/realm-bridge.csproj -c Release -r win-x64 --self-contained true --no-restore -o "$env:PKG/bridge"

      - name: Build Rust Workspace
        run: cargo build --release --workspace

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PKG | Out-Null
          Copy-Item target/release/skinforge.exe $env:PKG/
          Copy-Item target/release/skinforge-cli.exe $env:PKG/
          Copy-Item README.md $env:PKG/
          if (Test-Path LICENSE) { Copy-Item LICENSE $env:PKG/ }
          (Get-Content packaging/QUICKSTART.txt -Raw).Replace('__VERSION__', $env:RELEASE_TAG).Replace('__PLATFORM__', 'Windows x64') |
            Set-Content -Path "$env:PKG/QUICKSTART.txt" -Encoding utf8
          Compress-Archive -Path $env:PKG -DestinationPath "$env:PKG.zip"

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-asset
          path: ${{ env.PKG }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: version
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PKG: skinforge-${{ needs.version.outputs.tag }}-linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8 SDK
        shell: bash
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Restore C# Realm Bridge
        run: dotnet restore realm-bridge/realm-bridge.csproj -r linux-x64 --verbosity normal

      - name: Publish C# Realm Bridge (Self-Contained)
        run: dotnet publish realm-bridge/realm-bridge.csproj -c Release -r linux-x64 --self-contained true --no-restore -o "$PKG/bridge"

      - name: Build Rust Workspace
        run: cargo build --release --workspace

      - name: Assemble package
        run: |
          mkdir -p "$PKG"
          cp target/release/skinforge target/release/skinforge-cli "$PKG/"
          cp README.md "$PKG/"
          [ -f LICENSE ] && cp LICENSE "$PKG/" || true
          sed -e "s/__VERSION__/$RELEASE_TAG/g" -e "s/__PLATFORM__/Linux x64/g" packaging/QUICKSTART.txt > "$PKG/QUICKSTART.txt"
          chmod +x "$PKG/skinforge" "$PKG/skinforge-cli" "$PKG/bridge/realm-bridge"
          tar -czf "$PKG.tar.gz" "$PKG"

      - name: Upload Linux Asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-asset
          path: ${{ env.PKG }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes
        run: |
          WIN="skinforge-${TAG}-windows-x64.zip"
          LIN="skinforge-${TAG}-linux-x64.tar.gz"
          sed -e "s/__TAG__/${TAG}/g" -e "s/__WIN__/${WIN}/g" -e "s/__LIN__/${LIN}/g" packaging/release-template.md > release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SkinForge ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            assets/*
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
