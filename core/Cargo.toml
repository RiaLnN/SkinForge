[package]
name = "osu-mixer-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "osu_mixer_core"
path = "src/lib.rs"

[[bin]]
name = "osu-mixer"
path = "src/bin/cli.rs"

[dependencies]
sysinfo = { version = "0.30", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
