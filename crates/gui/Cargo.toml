[package]
name = "skinforge-gui"
version = "1.0.0"
edition = "2021"
description = "Desktop graphical interface for SkinForge (osu!lazer & osu!stable skin mixer)"
license = "MIT"

[dependencies]
skinforge-core = { path = "../core" }
eframe = "0.30"
egui = "0.30"
egui-phosphor = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis", "mp3"] }
rfd = "0.15"

[[bin]]
name = "skinforge"
path = "src/main.rs"
